info:
  name: Create Todo
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/todos"
  body:
    type: json
    data: |-
      {
        "title": "homework",
        "doneStatus": false,
        "description": "Do homework for bonus points"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
