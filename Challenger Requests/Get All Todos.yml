info:
  name: Get All Todos
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/todos?_sortBy=id"
  headers:
    - name: Accept
      value: text/csv
  params:
    - name: _sortBy
      value: id
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
