info:
  name: Patch Todo
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/todos/{{todoId}}"
  headers:
    - name: Content-Type
      value: application/merge-patch+json
  body:
    type: json
    data: |-
      {
        "doneStatus": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
