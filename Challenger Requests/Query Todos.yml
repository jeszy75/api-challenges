info:
  name: Query Todos
  type: http
  seq: 5

http:
  method: QUERY
  url: "{{baseUrl}}/todos"
  body:
    type: form-urlencoded
    data:
      - name: _sortBy
        value: -id
      - name: _limit
        value: "5"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
